<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cina AI - Advanced Intelligence & Systems</title>
    <style>
        :root {
            --bg-color: #090d16;
            --chat-bg: #111827;
            --card-bg: #1f2937;
            --text-color: #f3f4f6;
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --user-msg: #3b82f6;
            --ai-msg: #374151;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            height: 100vh; height: 100dvh;
            overflow: hidden;
        }
        header {
            background-color: var(--chat-bg);
            padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #1f2937;
            box-shadow: 0 4px 20px -2px rgba(0,0,0,0.5);
            z-index: 10; flex-shrink: 0;
        }
        .logo-area { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: bold; }
        .status-dot { width: 9px; height: 9px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }
        
        .main-layout { display: flex; flex: 1; overflow: hidden; width: 100%; position: relative; }
        sidebar {
            width: 280px; background-color: var(--chat-bg);
            border-right: 1px solid #1f2937; padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
            overflow-y: auto; flex-shrink: 0;
        }
        .feature-card { background-color: var(--card-bg); padding: 12px; border-radius: 8px; border: 1px solid #374151; }
        .feature-card h4 { margin: 0 0 5px 0; color: var(--accent-color); font-size: 0.9rem; }
        .feature-card p { margin: 0; font-size: 0.75rem; color: #9ca3af; }

        .chat-section { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-color); position: relative; height: 100%; overflow: hidden; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 10px 15px; border-radius: 10px; max-width: 85%; line-height: 1.5; word-wrap: break-word; font-size: 0.95rem; }
        .user-message { background-color: var(--user-msg); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-message { background-color: var(--ai-msg); color: var(--text-color); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #4b5563; }

        #input-container { background-color: var(--chat-bg); padding: 12px 15px; display: flex; gap: 10px; border-top: 1px solid #1f2937; flex-shrink: 0; width: 100%; }
        input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #374151; background-color: var(--bg-color); color: white; font-size: 0.95rem; outline: none; }
        input:focus { border-color: var(--accent-color); }
        button.send-btn { background-color: var(--accent-color); color: white; border: none; padding: 0 18px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; font-weight: bold; flex-shrink: 0; }

        @media(max-width: 768px) { sidebar { display: none; } }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="status-dot"></div>
            <span>CINA AI v1.0</span>
        </div>
        <div style="font-size: 0.8rem; color: #9ca3af;">Online</div>
    </header>

    <div class="main-layout">
        <sidebar>
            <h3 style="margin-top: 0; color: #e5e7eb; font-size: 0.95rem;">⚡ System Capabilities</h3>
            <div class="feature-card">
                <h4>Modular Architecture</h4>
                <p>Connected via api.js script.</p>
            </div>
        </sidebar>

        <div class="chat-section">
            <div id="chat-container">
                <div class="message ai-message">
                    Hello, how can I help you? 🚀
                </div>
            </div>

            <div id="input-container">
                <input type="text" id="user-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <!-- ایمپورت کردن فایل api.js در اینجا -->
    <script src="api.js"></script>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            messageDiv.classList.add(sender === 'user' ? 'user-message' : 'ai-message');
            messageDiv.textContent = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            // پیام در حال پردازش
            appendMessage("Thinking...", 'ai');

            // صدا زدن تابع از فایل api.js
            const aiResponse = await callOpenRouterAI(text);
            
            // حذف پیام "Thinking..." و قرار دادن پاسخ واقعی
            chatContainer.lastChild.remove();
            appendMessage(aiResponse, 'ai');
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
